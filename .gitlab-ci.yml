stages:
    - playwright-test

test:
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    stage: playwright-test

    before_script:
        - apt-get update && apt-get install -y default-jre wget unzip
        - wget https://github.com/allure-framework/allure2/releases/latest/download/allure-2.46.1.tgz
        - tar -zxvf allure-2.46.1.tgz
        - export PATH="$PATH:$PWD/allure-2.46.1/bin"

    script:
        - npm install
        - npx playwright install --with-deps
        - npx playwright test
        - allure generate allure-results --clean -o allure-report || true

    artifacts:
        when: always
        paths:
            - allure-report
        expire_in: 1 day